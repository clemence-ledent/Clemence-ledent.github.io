        function updateTextViewer() {
            if (!currentTextKey || !textConfigs[currentTextKey]) return;
            const config = textConfigs[currentTextKey];
            const leftImg = document.getElementById('text-viewer-left');
            const rightImg = document.getElementById('text-viewer-right');
            const aligner = document.getElementById('text-right-aligner');

            // Apply specific class for booklet layout sizing and alignment
            if (config.type === 'booklet') {
                leftImg.classList.add('booklet-frame');
                rightImg.classList.add('booklet-frame');
                if (aligner) aligner.classList.add('booklet-aligner');
            } else {
                leftImg.classList.remove('booklet-frame');
                rightImg.classList.remove('booklet-frame');
                if (aligner) aligner.classList.remove('booklet-aligner');
            }

            // Apply or remove border class based on configuration
            if (config.border) {
                leftImg.classList.remove('no-border');
                rightImg.classList.remove('no-border');
            } else {
                leftImg.classList.add('no-border');
                rightImg.classList.add('no-border');
            }

            if (config.type === 'single') {
                // For single page display setup (one page at a time)
                leftImg.style.display = 'none';
                rightImg.style.visibility = 'visible';
                rightImg.style.display = 'block';
                rightImg.src = `${config.folder}/${currentTextPageIndex}.png`;
            } else {
                // For booklet display setup (spread with page 1 & final page standalone handling)
                if (currentTextPageIndex === 1) {
                    leftImg.style.visibility = 'hidden';
                    leftImg.style.display = 'block';
                    leftImg.src = `${config.folder}/1.png`;

                    rightImg.style.visibility = 'visible';
                    rightImg.style.display = 'block';
                    rightImg.src = `${config.folder}/1.png`;
                } else if (currentTextPageIndex === config.total) {
                    leftImg.style.visibility = 'visible';
                    leftImg.style.display = 'block';
                    leftImg.src = `${config.folder}/${config.total}.png`;

                    rightImg.style.visibility = 'hidden';
                    rightImg.style.display = 'block';
                    rightImg.src = `${config.folder}/${config.total}.png`;
                } else {
                    leftImg.style.visibility = 'visible';
                    leftImg.style.display = 'block';
                    leftImg.src = `${config.folder}/${currentTextPageIndex}.png`;

                    if (currentTextPageIndex + 1 <= config.total) {
                        rightImg.style.visibility = 'visible';
                        rightImg.style.display = 'block';
                        rightImg.src = `${config.folder}/${currentTextPageIndex + 1}.png`;
                    } else {
                        rightImg.style.display = 'none';
                    }
                }
            }
        }

        /* Residus Audio Player Handler */
        let audioTimerInterval = null;

        function handleResidusAudio(isOpening) {
            const audioEl = document.getElementById('residus-audio-element');
            if (!audioEl) return;

            if (isOpening) {
                audioEl.ontimeupdate = updateResidusUI;
                audioEl.onloadedmetadata = updateResidusUI;
                updateResidusUI();
                if (audioTimerInterval) clearInterval(audioTimerInterval);
                audioTimerInterval = setInterval(updateResidusUI, 500);
            } else {
                audioEl.pause();
                audioEl.currentTime = 0;
                if (audioTimerInterval) clearInterval(audioTimerInterval);
            }
        }

        function toggleResidusAudio() {
            const audioEl = document.getElementById('residus-audio-element');
            if (!audioEl) return;

            if (audioEl.paused) {
                audioEl.load();
                audioEl.play().then(() => {
                    updateResidusUI();
                }).catch(e => {
                    console.log("Audio playback error:", e);
                });
            } else {
                audioEl.pause();
                updateResidusUI();
            }
        }

        function updateResidusUI() {
            const dot = document.getElementById('residus-audio-dot');
            const timer = document.getElementById('residus-timer');
            const audioEl = document.getElementById('residus-audio-element');
            if (!audioEl) return;

            let isPlaying = !audioEl.paused && audioEl.currentTime > 0 && !audioEl.ended;
            if (dot) {
                if (isPlaying) {
                    dot.style.background = 'rgb(0, 0, 255)';
                    dot.style.borderColor = 'rgb(0, 0, 255)';
                } else {
                    dot.style.background = '#fff';
                    dot.style.borderColor = '#000';
                }
            }
            if (timer) {
                let curM = Math.floor(audioEl.currentTime / 60);
                let curS = Math.floor(audioEl.currentTime % 60);
                let durM = isNaN(audioEl.duration) ? 0 : Math.floor(audioEl.duration / 60);
                let durS = isNaN(audioEl.duration) ? 0 : Math.floor(audioEl.duration % 60);
                timer.textContent = `${curM}:${curS < 10 ? '0':''}${curS} / ${durM}:${durS < 10 ? '0':''}${durS}`;
            }
        }

        function initializeNavigation() {
            container.innerHTML = '';
            
            let navItems = [
                ...tabs.map(t => ({ type: 'tab', name: t, id: `dot-${t}` })),
                ...workKeys.map((key, idx) => ({ type: 'work', key: key, num: idx + 1, id: `work-${key}` }))
            ];

            let placedCoordinates = [];
            
            navItems.forEach((item) => {
                const el = document.createElement('div');
                let posX, posY, overlapping;
                let attempts = 0;

                do {
                    overlapping = false;
                    posX = Math.random() * (window.innerWidth * 0.15 - 40) + 10;
                    posY = Math.random() * (window.innerHeight - 180) + 40;

                    for (let p of placedCoordinates) {
                        let dx = p.x - posX;
                        let dy = p.y - posY;
                        let distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 50) {
                            overlapping = true;
                            break;
                        }
                    }
                    attempts++;
                } while (overlapping && attempts < 50);

                placedCoordinates.push({ x: posX, y: posY });

                if (item.type === 'tab') {
                    el.className = 'dot';
                    el.id = item.id;
                    el.style.top = posY + 'px';
                    el.style.right = posX + 'px';
                    el.onclick = () => activateTab(item.name);
                } else {
                    el.className = 'work-trigger trigger';
                    el.id = item.id;
                    el.style.top = posY + 'px';
                    el.style.right = posX + 'px';
                    el.textContent = item.num;
                    el.onclick = () => showWork(item.key);
                }
                container.appendChild(el);
            });

            const thankYouBox = document.createElement('div');
            thankYouBox.id = 'thank-you-note';
            container.appendChild(thankYouBox);
        }

                        <p>The concept of ‘presence in absence’ is central to her work. By underlining the subtle sounds embedded in our daily gestures, or by deconstructing those gestures into singular happenings, Ledent shifts the spectator into an almost voyeuristic position toward how we carry ourselves. What appears playful or absurd ultimately reveals the orchestrated fragility of how we live with and alongside one another.</p>

            if (!data) return;

            if (data.type === 'single-gallery') {
                if (currentCollabState.imageIndex > 0) {
                    currentCollabState.imageIndex--;
                    document.getElementById('collab-single-img').src = `${data.folder}/${data.files[currentCollabState.imageIndex]}`;
                }
            } else if (data.type === 'sub-options') {
                const arr = data.suboptions[currentCollabState.subKey];
                if (arr && currentCollabState.imageIndex > 0) {
                    currentCollabState.imageIndex--;
                    document.getElementById('collab-single-img').src = arr[currentCollabState.imageIndex];
                }
            }
        }

        entryDot.onclick = function() {
            if (!this.classList.contains('transformed')) {
                this.classList.add('transformed');
                initializeNavigation();
                parseHashAndNavigate();
            }
        };

        function parseHashAndNavigate() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            if (hash === 'contact') {
                activateTab('Contact');
            } else if (hash === 'works') {
                activateTab('Works');
            } else if (hash.startsWith('works-')) {
                const sub = hash.replace('works-', '');
                let workKey = sub;
                if (!isNaN(sub)) {
                    const idx = parseInt(sub) - 1;
                    if (workKeys[idx]) workKey = workKeys[idx];
                }
                activateTab('Works', workKey);
            } else if (hash === 'collaborative-projects' || hash === 'collaborative' || hash === 'collab') {
                activateTab('Collaborative projects');
            } else if (hash.startsWith('collaborative-projects-') || hash.startsWith('collab-')) {
                const parts = hash.replace('collaborative-projects-', '').replace('collab-', '').split('-');
                activateTab('Collaborative projects', parts[0], parts[1]);
            } else if (hash === 'text') {
                activateTab('Text');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                entryDot.classList.add('transformed');
                initializeNavigation();
                parseHashAndNavigate();
            }
        });
    </script>
</body>
</html>
