<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="47pKQUKNiLfiB0YzYA75Dx0bHkYyUDsCU6oA0tGKBeY" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Identity Meta Tags -->
    <title>Clémence Ledent — Visual Artist & Performance</title>
    <meta name="description" content="Portfolio of Clémence Ledent (°2000, Brussels). Working with scripts, video performances and in situ audio installations">
    <meta name="keywords" content="Clémence Ledent, Visual Artist, Brussels, Installation Art, Media Art, Video Performance, Contemporary Art">
    <meta name="author" content="Clémence Ledent, clemence ledent">

    <!-- Social Media Preview Tags (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://clemenceledent.github.io/"> 
    <meta property="og:title" content="Clémence Ledent — Visual Artist">
    <meta property="og:description" content="Installations, video performances, and scripts exploring scripted social situations and spaces.">

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Clémence Ledent — Visual Artist">

    <meta name="twitter:image" content="https://clemenceledent.github.io/images/boke-kaas-1-website.jpg">

    <style>
        /* ==========================================================================
           GLOBAL & CORE LAYOUT
           ========================================================================== */
        body { 
            margin: 0; 
            background: #fff; 
            min-height: 100vh; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            overflow-y: auto; 
            position: relative;
            font-size: 18px; 
        }

        #main-container { display: flex; width: 100%; min-height: 100vh; }
        /* Expanded content width to use free space */
        #content-display { width: 82%; padding: 80px 60px; box-sizing: border-box; }
        
        /* The Dots Container & Elements */
        #tab-dots {
            position: fixed;
            top: 0;
            right: 0;
            width: 18%;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .dot {
            width: 32px; height: 32px; border-radius: 50%;
            background: #000; border: 1.8px solid #000;
            box-sizing: border-box; cursor: pointer;
            transition: background 0.3s; position: absolute; pointer-events: auto;
        }
        #entry-dot { top: 15%; right: 5%; position: fixed; }
        #entry-dot.transformed { background: #fff; border-color: rgb(0, 0, 255); cursor: default; }
        .dot.active { background: rgb(0, 0, 255); border-color: rgb(0, 0, 255); }

        /* General Trigger Behavior (Prevents Jumping) */
        .trigger { cursor: pointer; color: #000; font-weight: 400; white-space: nowrap; width: fit-content; }
        .trigger.active { text-decoration: underline; }
        /* Expanded content-area max-width */
        #content-area { margin-top: 30px; color: #000; font-weight: 300; line-height: 1.6; max-width: 900px; }

        /* Horizontal Image Gallery Styling (Images made 20% bigger: 504px) */
        .horizontal-gallery {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            margin-top: 25px;
            padding-bottom: 15px;
            scroll-behavior: smooth;
        }
        .horizontal-gallery img {
            height: 504px;
            max-height: 55vh;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 2px;
        }
        /* Custom subtle scrollbar for horizontal gallery */
        .horizontal-gallery::-webkit-scrollbar {
            height: 6px;
        }
        .horizontal-gallery::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        .horizontal-gallery::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        /* ==========================================================================
           1. CONTACT SECTION (Styling)
           ========================================================================== */
        .blue-text { color: rgb(0, 0, 255); font-weight: 400; line-height: 1.4; }
        .contact-bio { 
            font-weight: 300; 
            color: #000; 
            margin-top: 40px; 
            line-height: 1.6; 
            max-width: 900px; 
        }

        /* ==========================================================================
           2. WORKS SECTION (Layout & Subtabs)
           ========================================================================== */
        .works-nav { 
            display: flex; 
            flex-wrap: wrap; 
            column-gap: 50px; 
            row-gap: 20px; 
            margin-bottom: 50px; 
            align-items: center; 
        }
        
        /* Work Subtab Numbers (Hidden by default, shown when Works tab is active) */
        .work-trigger {
            cursor: pointer; 
            color: #000; 
            font-weight: 400; 
            width: 32px; 
            height: 32px; 
            display: none; /* Only appears on Works tab */
            align-items: center; 
            justify-content: center; 
            font-size: 22px; 
            box-sizing: border-box;
            transition: none; 
            position: absolute; 
            pointer-events: auto;
        }
        .work-trigger.visible {
            display: inline-flex;
        }
        .work-trigger.active {
            background: #000; 
            border: 1.8px solid #000; 
            border-radius: 50%; 
            color: transparent; 
        }

        /* Collaborative Projects Styling */
        .collab-trigger.active-troue { text-decoration: underline; }
        .collab-trigger.active-braida { text-decoration: underline; }
        .collab-trigger.active-rotte { color: brown; }

        /* Special 'o' for Le bazar troué */
        .filled-o { position: relative; }
        .collab-trigger.active-troue .filled-o::before {
            content: ""; position: absolute; width: 7px; height: 7px;
            background: #000; border-radius: 50%; top: 55%; left: 50%;
            transform: translate(-50%, -50%); z-index: -1;
        }

        /* ==========================================================================
           3. TEXT SECTION (Layout & Subtabs)
           ========================================================================== */
        .subnav-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 50px; }
        
        /* Links between Work and Text */
        .link-to-work { color: #ea5bf6; text-decoration: underline; cursor: pointer; }
        .link-to-text { color: rgb(0, 0, 255); text-decoration: underline; cursor: pointer; }

        /* ==========================================================================
           4. THANK YOU NOTE (Right column, directly under navigation dots)
           ========================================================================== */
        #thank-you-note {
            position: absolute;
            bottom: 30px;
            right: 20px;
            left: 20px;
            font-size: 13px;
            font-style: italic;
            color: #000;
            text-align: right;
            line-height: 1.4;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="entry-dot" class="dot"></div>
    <div id="tab-dots"></div>

    <div id="main-container">
        <div id="content-display"></div>
    </div>

    <script>
        const tabs = ['Contact', 'Works', 'Collaborative projects', 'Text'];
        const workKeys = ['residus', 'kitchen', 'waitingline', 'chihuahua', 'boke', 'celebratie', 'abc', 'untitled', 'sunnyside', 'metverwarring'];

        /* ==========================================================================
           DATA: WORKS CONTENT
           ========================================================================== */
        const worksData = {
            'residus': { 
                info: '<strong>Residus (Bartsoen)</strong> (2026)<br>In situ sound installation: obsessively tidied conference room, handmade speakers<br><br><em>A staging of presence through absence. Speakers are scattered throughout the space, emitting commonplace sounds of four invisible characters. The work uses ambient sound to trigger a hyper-awareness of the physical space and the bodies that occupy it.</em><br><br><img src="images/Bartsoen-1-website.jpg" alt="Residus (Bartsoen)" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/Bartsoen-2-website.jpg" alt="Residus (Bartsoen)" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/Bartsoen-5-website.jpg" alt="Residus (Bartsoen)" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/Bartsoen-6-website.jpg" alt="Residus (Bartsoen)" style="max-width: 100%; height: auto; margin-top: 20px;">' 
            },
            'kitchen': { 
                info: '<strong>Situation for a small kitchen and adjacent dining room with a narrow window giving on the outside.</strong> (2026)<br>Spatial installation and performance setup<br><br><em>Content for this work coming soon...</em>' 
            },
            'waitingline': { 
                info: '<strong>The waiting line</strong> (2026)<br>1:1 cardboard cutouts, questionnaires<br><br><em>How do we perceive? A reflection on social stereotypes and collective assumptions. Life-sized figures, viewed only from behind, generated by AI based on descriptions of people I encountered in Ghent. Spectators are invited to fill out questionnaires, speculating on the hidden lives and identities of these anonymous individuals.</em><br><br><div class="horizontal-gallery"><img src="images/wachtrij-1-website.jpeg" alt="The waiting line 1"><img src="images/wachtrij-2-website.jpeg" alt="The waiting line 2"></div>' 
            },
            'chihuahua': { 
                info: '<strong>The chihuahua theory</strong> (2026)<br>Text and temporary tattoo<br><br><div class="horizontal-gallery"><img src="images/chihuahua theory-1-website.jpeg" alt=The chihuahua theory style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/chihuahua theory-2-website.jpeg" alt=The chihuahua theory style="max-width: 100%; height: auto; margin-top: 20px;"></div>'
            },
            'boke': { 
                info: '<strong>Boke kaas</strong> (2026)<br>Video performance<br><br><em>Three characters are making and eating a cheese sandwich. They stare just past the camera.</em><br><br><img src="images/boke-kaas-1-website.jpg" alt="Boke Kaas" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/boke-kaas-2-website.jpg" alt="Boke Kaas" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/boke-kaas-3-website.jpg" alt="Boke Kaas" style="max-width: 100%; height: auto; margin-top: 20px;">' 
            },
            'celebratie': { 
                info: '<strong>celebratie compagnons</strong> (2026)<br>Sculptural installation<br><br><em>Curly ornaments that wish to celebrate the space.</em>' 
            },
            'abc': { 
                info: '<strong>A, B, C</strong> (2025)<br>Video performance, script<br><br><em>Research on entropy (tested in a controlled environment). Seated at a table, one character attempts to contain the rising tension between the two others.</em><br><br><img src="images/ABC-1-website.png" alt="A, B, C" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/ABC-2-website.png" alt="A, B, C" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/ABC-3-website.png" alt="A, B, C" style="max-width: 100%; height: auto; margin-top: 20px;">' 
            },
            'untitled': { 
                info: '<strong>Untitled (pas de mousquetaires)</strong> (2025)<br>Archival video, digital alteration<br><br><em>Archival video exploration featuring digital alteration.</em><br><br><img src="images/Censure-1-website.png" alt="Untitled (pas de mousquetaires)" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/censure-2-website.png" alt="Untitled (pas de mousquetaires)" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/censure-3-website.png" alt="Untitled (pas de mousquetaires)" style="max-width: 100%; height: auto; margin-top: 20px;">' 
            },
            'sunnyside': { 
                info: '<strong>Sunny side Up</strong> (2025)<br>Collage series, poster design<br><br><em>Presented during Le Bazar troué at Salvatore Ghent.</em>' 
            },
            'metverwarring': { 
                info: '<strong>Met verwarring in de wachtruimte</strong> (2024)<br>Performance, mise-en-scène<br><br><em>Immersive performance navigating around a counter. Participants wear jackets blending them into the architecture. Guided through a cycle of calculated confusion, the participants get stuck in a loop staging the impossibility of truly accessing the "other side".</em>' 
            }
        };

        /* ==========================================================================
           DATA: THANK YOU NOTES (For specific works)
           ========================================================================== */
        const thanksData = {
            'waitingline': 'Thanks to the visitors to answer the questionnaire',
            'boke': 'Thanks to Puck van der Poel, Merel Van den Eynde, Oona Antonissen, Rinke Van Der Veen, Elisa Palm, Freek Lannoo, Thomas Joostens',
            'abc': 'Thanks to Malou Legrand, Puck van der Poel, Rinke Van Der Veen'
        };

        /* ==========================================================================
           DATA: COLLABORATIVE PROJECTS CONTENT
           ========================================================================== */
        const collabData = {
            'troue': { 
                info: '<strong>Le bazar troué</strong> (2025)<br>Group exhibition with works from <strong>Ibe De Cat, Merel Van den Eynde, Puck van der Poel, Louis Locus, Elisa Palm, Willem Roekaers and Clémence Ledent</strong><br><br><em>réflections illustrées</em>' 
            },
            'braida': { 
                info: '2024, 2026<br>In collaboration with <strong>Claude Perischetti</strong> and <strong>Greta Petiziol</strong>. One week residency in the Mountains of North Italy.<br>' 
            },
            'rotte': { 
                info: '°2026<br>Experimental/musical/ambiant/electronic/theatrical evenings, a collaboration.<br>' 
            }
        };

        /* ==========================================================================
           DATA: TEXT CONTENT
           ========================================================================== */
        const textData = {
            'denkbeeldig': { title: 'De denkbeeldige ruimte', content: 'Text for De denkbeeldige ruimte...' },
            'shopsign': { title: 'De shopsign', content: 'Text for De shopsign...' },
            'chihuahua-theory': { 
                title: 'De chihuahua theorie', 
                content: 'Hier komt de tekst van de chihuahua theorie...' 
            },
            'tafelgebeuren': { title: 'Het rigiditeitsgehalte van een tafelgebeuren', content: 'Text for tafelgebeuren...' }
        };

        /* ==========================================================================
           CORE LOGIC: NAVIGATION & RENDERING
           ========================================================================== */
        const entryDot = document.getElementById('entry-dot');
        const container = document.getElementById('tab-dots');
        const display = document.getElementById('content-display');

        function updateHash(mainTab, subKey = null) {
            let hash = '#' + mainTab.toLowerCase().replace(/\s+/g, '-');
            if (subKey) {
                if (mainTab === 'Works') {
                    const idx = workKeys.indexOf(subKey);
                    if (idx !== -1) hash += '-' + (idx + 1);
                    else hash += '-' + subKey;
                } else {
                    hash += '-' + subKey;
                }
            }
            window.location.hash = hash;
        }

        function setThankYouNote(key = null) {
            let thankYouBox = document.getElementById('thank-you-note');
            if (!thankYouBox) {
                thankYouBox = document.createElement('div');
                thankYouBox.id = 'thank-you-note';
                container.appendChild(thankYouBox);
            }
            if (key && thanksData[key]) {
                thankYouBox.innerHTML = thanksData[key];
            } else {
                thankYouBox.innerHTML = '';
            }
        }

        function initializeNavigation() {
            container.innerHTML = '';
            
            let navItems = [
                ...tabs.map(t => ({ type: 'tab', name: t, id: `dot-${t}` })),
                ...workKeys.map((key, idx) => ({ type: 'work', key: key, num: idx + 1, id: `work-${key}` }))
            ];

            let placedCoordinates = [];
            
            navItems.forEach((item) => {
                const el = document.createElement('div');
                let posX, posY, overlapping;
                let attempts = 0;

                // Ensure items never overlap with each other (preventing numbers from hiding under dots)
                do {
                    overlapping = false;
                    posX = Math.random() * (container.clientWidth - 70) + 10;
                    posY = Math.random() * (window.innerHeight - 180) + 40;

                    for (let p of placedCoordinates) {
                        let dx = p.x - posX;
                        let dy = p.y - posY;
                        let distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 50) { // Minimum spacing to prevent overlaps
                            overlapping = true;
                            break;
                        }
                    }
                    attempts++;
                } while (overlapping && attempts < 50);

                placedCoordinates.push({ x: posX, y: posY });

                if (item.type === 'tab') {
                    el.className = 'dot';
                    el.id = item.id;
                    el.style.top = posY + 'px';
                    el.style.left = posX + 'px';
                    el.onclick = () => activateTab(item.name);
                } else {
                    el.className = 'work-trigger trigger';
                    el.id = item.id;
                    el.style.top = posY + 'px';
                    el.style.left = posX + 'px';
                    el.textContent = item.num;
                    el.onclick = () => showWork(item.key);
                }
                container.appendChild(el);
            });

            // Re-append the thank-you note container at the bottom of the right column
            const thankYouBox = document.createElement('div');
            thankYouBox.id = 'thank-you-note';
            container.appendChild(thankYouBox);
        }

        function activateTab(tabName, subTabToOpen = null) {
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            const dot = document.getElementById(`dot-${tabName}`);
            if (dot) dot.classList.add('active');

            // Show or hide work numbers depending on active tab
            document.querySelectorAll('.work-trigger').forEach(wt => {
                if (tabName === 'Works') wt.classList.add('visible');
                else wt.classList.remove('visible');
            });

            // Clear thank you note when changing main tabs
            setThankYouNote(null);

            renderTab(tabName, subTabToOpen);

            if (tabName === 'Contact') updateHash('Contact');
            else if (tabName === 'Works' && !subTabToOpen) updateHash('Works');
            else if (tabName === 'Collaborative projects' && !subTabToOpen) updateHash('Collaborative projects');
            else if (tabName === 'Text' && !subTabToOpen) updateHash('Text');
        }

        function renderTab(tabName, autoOpenSub = null) {
            display.innerHTML = '';
            
            // 1. Contact Rendering
            if (tabName === 'Contact') {
                display.innerHTML = `
                    <div class="blue-text">
                        <div>Clémence Ledent</div><div>°2000, Brussels</div>
                        <div>ledent.clemence@gmail.com</div>
                    </div>
                    <div class="contact-bio">
                        <p>Clémence Ledent explores the invisible scripts and social codes that define our daily behaviour. Informed by her background in architecture, she examines space, function, and the impact they have on the body. Her practice is scenario-based: each project begins with an autopsy of the structures that determine how we move, wait, listen, or act. Echoing Nathalie Sarraute’s notion of tropisms, she seeks to capture the minute, imperceptible movements beneath the surface, blurring the lines between human agency and ingrained automatisms.</p>
                        <p>The concept of ‘presence in absence’ is central to her work. By underlining the subtle sounds embedded in our daily gestures, or by deconstructing those gestures into singular happenings, Ledent shifts the spectator into an almost voyeuristic position toward how we carry ourselves. What appears playful or absurd ultimately reveals the orchestrated fragility of how we live with and alongside one another.</p>
                    </div>`;
            
            // 2. Works Rendering
            } else if (tabName === 'Works') {
                display.innerHTML = `<div id="content-area"></div>`;
                if(autoOpenSub) {
                    showWork(autoOpenSub);
                } else {
                    document.getElementById('content-area').innerHTML = '';
                }
            
            // 3. Collaborative Projects Rendering
            } else if (tabName === 'Collaborative projects') {
                display.innerHTML = `
                    <div class="works-nav">
                        <span class="collab-trigger trigger" id="collab-troue" onclick="showCollab('troue')">Le bazar tr<span class="filled-o">o</span>ué</span>
                        <span class="collab-trigger trigger" id="collab-braida" onclick="showCollab('braida')">toç in braida</span>
                        <span class="collab-trigger trigger" id="collab-rotte" onclick="showCollab('rotte')">Alle rotte takken</span>
                    </div><div id="content-area"></div>`;
                if(autoOpenSub) showCollab(autoOpenSub);
            
            // 4. Text Rendering
            } else if (tabName === 'Text') {
                display.innerHTML = `
                    <div class="subnav-container">
                        <span class="trigger" id="text-denkbeeldig" onclick="showText('denkbeeldig')">De denkbeeldige ruimte</span>
                        <span class="trigger" id="text-shopsign" onclick="showText('shopsign')">De shopsign</span>
                        <span class="trigger" id="text-chihuahua-theory" onclick="showText('chihuahua-theory')">De chihuahua theorie</span>
                        <span class="trigger" id="text-tafelgebeuren" onclick="showText('tafelgebeuren')">Het rigiditeitsgehalte van een tafelgebeuren</span>
                    </div><div id="content-area"></div>`;
                if(autoOpenSub) showText(autoOpenSub);
            }
        }

        /* Helper Functions to handle Subtabs */
        function showWork(key) {
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            const workDot = document.getElementById('dot-Works');
            if (workDot) workDot.classList.add('active');

            // Make sure numbers are visible
            document.querySelectorAll('.work-trigger').forEach(wt => wt.classList.add('visible'));

            if (!document.getElementById('content-area')) {
                display.innerHTML = `<div id="content-area"></div>`;
            }

            document.querySelectorAll('.work-trigger').forEach(t => t.classList.remove('active'));
            const el = document.getElementById('work-' + key);
            if(el) el.classList.add('active');

            if (worksData[key]) {
                document.getElementById('content-area').innerHTML = worksData[key].info;
            }

            // Set thank-you note for this work
            setThankYouNote(key);
            updateHash('Works', key);
        }

        function showCollab(key) {
            setThankYouNote(null);
            document.querySelectorAll('.collab-trigger').forEach(t => t.className = 'collab-trigger trigger');
            const el = document.getElementById('collab-' + key);
            if(el) el.classList.add('active-' + key);
            document.getElementById('content-area').innerHTML = collabData[key].info;
            updateHash('Collaborative projects', key);
        }

        function showText(key) {
            setThankYouNote(null);
            document.querySelectorAll('.subnav-container .trigger').forEach(t => t.classList.remove('active'));
            const el = document.getElementById('text-' + key);
            if(el) el.classList.add('active');
            document.getElementById('content-area').innerHTML = textData[key].content;
            updateHash('Text', key);
        }

        entryDot.onclick = function() {
            if (!this.classList.contains('transformed')) {
                this.classList.add('transformed');
                initializeNavigation();
                parseHashAndNavigate();
            }
        };

        function parseHashAndNavigate() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            if (hash === 'contact') {
                activateTab('Contact');
            } else if (hash === 'works') {
                activateTab('Works');
            } else if (hash.startsWith('works-')) {
                const sub = hash.replace('works-', '');
                let workKey = sub;
                if (!isNaN(sub)) {
                    const idx = parseInt(sub) - 1;
                    if (workKeys[idx]) workKey = workKeys[idx];
                }
                activateTab('Works', workKey);
            } else if (hash === 'collaborative-projects' || hash === 'collaborative' || hash === 'collab') {
                activateTab('Collaborative projects');
            } else if (hash.startsWith('collaborative-projects-') || hash.startsWith('collab-')) {
                const sub = hash.replace('collaborative-projects-', '').replace('collab-', '');
                activateTab('Collaborative projects', sub);
            } else if (hash === 'text') {
                activateTab('Text');
            } else if (hash.startsWith('text-')) {
                const sub = hash.replace('text-', '');
                activateTab('Text', sub);
            }
        }

        // Auto-load if visiting with an existing hash
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                entryDot.classList.add('transformed');
                initializeNavigation();
                parseHashAndNavigate();
            }
        });
    </script>
</body>
</html>
