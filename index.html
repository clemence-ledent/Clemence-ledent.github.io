<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="47pKQUKNiLfiB0YzYA75Dx0bHkYyUDsCU6oA0tGKBeY" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Identity Meta Tags -->
    <title>Clémence Ledent — Visual Artist & Performance</title>
    <meta name="description" content="Portfolio of Clémence Ledent (°2000, Brussels). Working with installations, video performances, scripts, and audio in social contexts.">
    <meta name="keywords" content="Clémence Ledent, Visual Artist, Brussels, Installation Art, Performance Art, Video Performance, Contemporary Art">
    <meta name="author" content="Clémence Ledent">

    <!-- Social Media Preview Tags (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://clemenceledent.github.io/"> <!-- Update with your exact GitHub URL if different -->
    <meta property="og:title" content="Clémence Ledent — Visual Artist">
    <meta property="og:description" content="Installations, video performances, and scripts exploring scripted social situations and spaces.">
    <meta property="og:image" content="https://clemenceledent.github.io/images/boke-kaas-1-website.jpg">

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Clémence Ledent — Visual Artist">
    <meta name="twitter:description" content="Portfolio of Clémence Ledent. Installations, video performances, and scripts.">
    <meta name="twitter:image" content="https://clemenceledent.github.io/images/boke-kaas-1-website.jpg">

    <style>
        /* ==========================================================================
           GLOBAL & CORE LAYOUT
           ========================================================================== */
        body { 
            margin: 0; 
            background: #fff; 
            min-height: 100vh; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            overflow-y: auto; 
            position: relative;
            font-size: 18px; 
        }

        #main-container { display: flex; width: 100%; min-height: 100vh; }
        #content-display { width: 75%; padding: 80px 60px; box-sizing: border-box; }
        
        /* The Dots */
        .dot {
            width: 32px; height: 32px; border-radius: 50%;
            background: #000; border: 1.8px solid #000;
            box-sizing: border-box; cursor: pointer;
            transition: background 0.3s; position: fixed; z-index: 100;
        }
        #entry-dot { top: 15%; right: 10%; }
        #entry-dot.transformed { background: #fff; border-color: rgb(0, 0, 255); cursor: default; }
        .dot.active { background: rgb(0, 0, 255); border-color: rgb(0, 0, 255); }

        /* General Trigger Behavior (Prevents Jumping) */
        .trigger { cursor: pointer; color: #000; font-weight: 400; white-space: nowrap; width: fit-content; }
        .trigger.active { text-decoration: underline; }
        #content-area { margin-top: 30px; color: #000; font-weight: 300; line-height: 1.6; max-width: 700px; }

        /* ==========================================================================
           1. CONTACT SECTION (Styling)
           ========================================================================== */
        .blue-text { color: rgb(0, 0, 255); font-weight: 400; line-height: 1.4; }
        .contact-bio { 
            font-weight: 300; 
            color: #000; 
            margin-top: 40px; 
            line-height: 1.6; 
            max-width: 700px; 
        }

        /* ==========================================================================
           2. WORKS SECTION (Layout & Subtabs)
           ========================================================================== */
        .works-nav { 
            display: flex; 
            flex-wrap: wrap; 
            column-gap: 35px; 
            row-gap: 15px; 
            margin-bottom: 50px; 
            align-items: center; 
        }
        
        /* Individual Work Colors & Interaction */
        .work-trigger.active-residus { color: rgb(0, 100, 255); }
        .work-trigger.active-waitingline { color: rgb(100, 100, 100); }
        .work-trigger.active-boke { color: #fcbe11; }
        .work-trigger.active-celebratie { color: #ff69b4; }
        .work-trigger.active-abc { text-shadow: 0.5px 0 0 black, -0.5px 0 0 black; }
        .work-trigger.active-untitled { font-style: italic; }
        .work-trigger.active-sunnyside { color: orange; }
        .work-trigger.active-metverwarring { color: purple; }

        /* Collaborative Projects Styling */
        .collab-trigger.active-troue { text-decoration: underline; }
        .collab-trigger.active-braida { text-decoration: underline; }
        .collab-trigger.active-rotte { color: brown; }

        /* Special 'o' for Le bazar troué */
        .filled-o { position: relative; }
        .collab-trigger.active-troue .filled-o::before {
            content: ""; position: absolute; width: 7px; height: 7px;
            background: #000; border-radius: 50%; top: 55%; left: 50%;
            transform: translate(-50%, -50%); z-index: -1;
        }

        /* ==========================================================================
           3. TEXT SECTION (Layout & Subtabs)
           ========================================================================== */
        .subnav-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 50px; }
        
        /* Links between Work and Text */
        .link-to-work { color: #ea5bf6; text-decoration: underline; cursor: pointer; }
        .link-to-text { color: rgb(0, 0, 255); text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

    <div id="entry-dot" class="dot"></div>
    <div id="tab-dots"></div>

    <div id="main-container">
        <div id="content-display"></div>
    </div>

    <script>
        const tabs = ['Contact', 'Works', 'Collaborative projects', 'Text'];

        /* ==========================================================================
           DATA: WORKS CONTENT
           ========================================================================== */
        const worksData = {
            'residus': { 
                info: '°2026<br>In situ sound installation: obsessively tidied conference room, handmade speakers<br><br><em>A staging of presence through absence. Speakers are scattered throughout the space, emitting commonplace sounds of four invisible characters. The work uses ambient sound to trigger a hyper-awareness of the physical space and the bodies that occupy it.</em>' 
            },
            'waitingline': { 
                info: '°2026<br>1:1 cardboard cutouts, questionnaires<br><br><em>How do we perceive? A reflection on social stereotypes and collective assumptions. Life-sized figures, viewed only from behind, generated by AI based on descriptions of people I encountered in Ghent. Spectators are invited to fill out questionnaires, speculating on the hidden lives and identities of these anonymous individuals.</em>' 
            },
            'boke': { 
                info: '°2026<br>Video performance<br><br><em>Three characters are making and eating a cheese sandwich. They stare just past the camera.</em><br><br><img src="images/boke-kaas-1-website.jpg" alt="Boke Kaas" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/boke-kaas-2-website.jpg" alt="Boke Kaas" style="max-width: 100%; height: auto; margin-top: 20px;"><br><br><img src="images/boke-kaas-3-website.jpg" alt="Boke Kaas" style="max-width: 100%; height: auto; margin-top: 20px;">' 
            },
            'celebratie': { 
                info: '°2026<br>Sculptural installation<br><br><em>Curly ornaments that wish to celebrate the space.</em>' 
            },
            'abc': { 
                info: '°2025<br>Video performance, script<br><br><em>Research on entropy (tested in a controlled environment). Seated at a sterile table in what seems to be a parking lot, one character attempts to contain the rising tension between the two others.</em>' 
            },
            'untitled': { 
                info: '°2025<br>Archival video, digital alteration<br><br><em>Archival video exploration featuring digital alteration.</em>' 
            },
            'sunnyside': { 
                info: '°2025<br>Collage series, poster design<br><br><em>Presented during Le Bazar troué at Salvatore Ghent.</em>' 
            },
            'metverwarring': { 
                info: '°2024<br>Performance, mise-en-scène<br><br><em>Immersive performance navigating around a counter. Participants wear jackets blending them into the architecture. Guided through a cycle of calculated confusion, the participants get stuck in a loop staging the impossibility of truly accessing the "other side".</em>' 
            }
        };

        /* ==========================================================================
           DATA: COLLABORATIVE PROJECTS CONTENT
           ========================================================================== */
        const collabData = {
            'troue': { 
                info: '°2025<br>expo, curatie, "réflexions illustrées"<br><br><em>Collaborative exhibition project centering around curation and illustrated reflections.</em>' 
            },
            'braida': { 
                info: '°2024<br>résidentie, expo, samenkomst<br><br><em>Residency, exhibition, and gathering project exploring shared spaces.</em>' 
            },
            'rotte': { 
                info: '°2026<br>Collaborative installation<br><br><em>Alle rotte takken collaborative project description.</em>' 
            }
        };

        /* ==========================================================================
           DATA: TEXT CONTENT
           ========================================================================== */
        const textData = {
            'denkbeeldig': { title: 'De denkbeeldige ruimte', content: 'Text for De denkbeeldige ruimte...' },
            'shopsign': { title: 'De shopsign', content: 'Text for De shopsign...' },
            'chihuahua-theory': { 
                title: 'De chihuahua theorie', 
                content: 'Hier komt de tekst van de chihuahua theorie...' 
            },
            'tafelgebeuren': { title: 'Het rigiditeitsgehalte van een tafelgebeuren', content: 'Text for tafelgebeuren...' }
        };

        /* ==========================================================================
           CORE LOGIC: NAVIGATION & RENDERING
           ========================================================================== */
        const entryDot = document.getElementById('entry-dot');
        const container = document.getElementById('tab-dots');
        const display = document.getElementById('content-display');

        function initializeNavigation() {
            container.innerHTML = '';
            let positions = Array.from({length: tabs.length}, () => Math.random() * (window.innerHeight - 100) + 50).sort((a, b) => a - b);

            tabs.forEach((tabName, index) => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.id = `dot-${tabName}`;
                const minX = window.innerWidth * 0.75;
                const maxX = window.innerWidth - 60;
                dot.style.top = positions[index] + 'px';
                dot.style.left = (Math.random() * (maxX - minX) + minX) + 'px';
                dot.onclick = () => activateTab(tabName);
                container.appendChild(dot);
            });
        }

        function activateTab(tabName, subTabToOpen = null) {
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            const dot = document.getElementById(`dot-${tabName}`);
            if (dot) dot.classList.add('active');
            renderTab(tabName, subTabToOpen);
        }

        function switchTab(mainTab, subTab) {
            activateTab(mainTab, subTab);
        }

        function renderTab(tabName, autoOpenSub = null) {
            display.innerHTML = '';
            
            // 1. Contact Rendering
            if (tabName === 'Contact') {
                display.innerHTML = `
                    <div class="blue-text">
                        <div>Clémence Ledent</div><div>°2000, Brussels</div>
                        <div>ledent.clemence@gmail.com</div><div>+32474957647</div>
                    </div>
                    <div class="contact-bio">
                        <p>Clémence Ledent werkt met installaties, performances en filmische formats waarin sociale situaties worden gescript en licht ontregeld. Ze vertrekt vanuit alledaagse contexten zoals wachtruimtes, gangen of diners, en onderzoekt hoe ruimte, timing en impliciete regels ons gedrag sturen.</p>
                        <p>Haar praktijk is scenario-gebaseerd: elk werk vertrekt vanuit een structuur die bepaalt hoe bezoekers zich bewegen, wachten, luisteren of handelen. De toeschouwer wordt daarbij geen externe kijker, maar een actieve schakel binnen het werk. Er is geen duidelijke grens tussen acteur en spectator.</p>
                        <p>Ledent werkt met geluid, objecten, tekstfragmenten en performatieve handelingen. Taal wordt vaak gereduceerd of bewust onvolledig gelaten; acties en stiltes dragen de betekenis. Haar installaties functioneren door gebruik — of net door het ontbreken daarvan — en maken zichtbaar hoe aandacht circuleert binnen een ruimte.</p>
                        <p>Wat ogenschijnlijk speels of absurd is, legt sociale codes bloot en test hun breekbaarheid. Het werk ontstaat in de spanning tussen controle en toeval, tussen script en improvisatie.</p>
                    </div>`;
            
            // 2. Works Rendering
            } else if (tabName === 'Works') {
                display.innerHTML = `
                    <div class="works-nav">
                        <span class="work-trigger trigger" id="work-residus" onclick="showWork('residus')">Residus (Bartsoen)</span>
                        <span class="work-trigger trigger" id="work-waitingline" onclick="showWork('waitingline')">The waiting line</span>
                        <span class="work-trigger trigger" id="work-boke" onclick="showWork('boke')">Boke kaas</span>
                        <span class="work-trigger trigger" id="work-celebratie" onclick="showWork('celebratie')">celebratie compagnons</span>
                        <span class="work-trigger trigger" id="work-abc" onclick="showWork('abc')">A, B, C</span>
                        <span class="work-trigger trigger" id="work-untitled" onclick="showWork('untitled')">Untitled (pas de mousquetaire)</span>
                        <span class="work-trigger trigger" id="work-sunnyside" onclick="showWork('sunnyside')">Sunny side Up</span>
                        <span class="work-trigger trigger" id="work-metverwarring" onclick="showWork('metverwarring')">Met verwarring in de wachtruimte</span>
                    </div><div id="content-area"></div>`;
                if(autoOpenSub) showWork(autoOpenSub);
            
            // 3. Collaborative Projects Rendering
            } else if (tabName === 'Collaborative projects') {
                display.innerHTML = `
                    <div class="works-nav">
                        <span class="collab-trigger trigger" id="collab-troue" onclick="showCollab('troue')">Le bazar tr<span class="filled-o">o</span>ué</span>
                        <span class="collab-trigger trigger" id="collab-braida" onclick="showCollab('braida')">toç in braida</span>
                        <span class="collab-trigger trigger" id="collab-rotte" onclick="showCollab('rotte')">Alle rotte takken</span>
                    </div><div id="content-area"></div>`;
                if(autoOpenSub) showCollab(autoOpenSub);
            
            // 4. Text Rendering
            } else if (tabName === 'Text') {
                display.innerHTML = `
                    <div class="subnav-container">
                        <span class="trigger" id="text-denkbeeldig" onclick="showText('denkbeeldig')">De denkbeeldige ruimte</span>
                        <span class="trigger" id="text-shopsign" onclick="showText('shopsign')">De shopsign</span>
                        <span class="trigger" id="text-chihuahua-theory" onclick="showText('chihuahua-theory')">De chihuahua theorie</span>
                        <span class="trigger" id="text-tafelgebeuren" onclick="showText('tafelgebeuren')">Het rigiditeitsgehalte van een tafelgebeuren</span>
                    </div><div id="content-area"></div>`;
                if(autoOpenSub) showText(autoOpenSub);
            }
        }

        /* Helper Functions to handle Subtabs */
        function showWork(key) {
            document.querySelectorAll('.work-trigger').forEach(t => t.className = 'work-trigger trigger');
            const el = document.getElementById('work-' + key);
            if(el) el.classList.add('active-' + key);
            document.getElementById('content-area').innerHTML = worksData[key].info;
        }

        function showCollab(key) {
            document.querySelectorAll('.collab-trigger').forEach(t => t.className = 'collab-trigger trigger');
            const el = document.getElementById('collab-' + key);
            if(el) el.classList.add('active-' + key);
            document.getElementById('content-area').innerHTML = collabData[key].info;
        }

        function showText(key) {
            document.querySelectorAll('.subnav-container .trigger').forEach(t => t.classList.remove('active'));
            const el = document.getElementById('text-' + key);
            if(el) el.classList.add('active');
            document.getElementById('content-area').innerHTML = textData[key].content;
        }

        entryDot.onclick = function() {
            if (!this.classList.contains('transformed')) {
                this.classList.add('transformed');
                initializeNavigation();
            }
        };
    </script>
</body>
</html>
