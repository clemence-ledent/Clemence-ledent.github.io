        /* Residus Audio Player Handler */
        let residusAudio = null;
        let audioTimerInterval = null;

        function handleResidusAudio(isOpening) {
            if (isOpening) {
                if (!residusAudio) {
                    residusAudio = new Audio('other/Bartsoen.mp3');
                    residusAudio.loop = true;
                    residusAudio.ontimeupdate = updateResidusUI;
                    residusAudio.onloadedmetadata = updateResidusUI;
                }
                updateResidusUI();
                if (audioTimerInterval) clearInterval(audioTimerInterval);
                audioTimerInterval = setInterval(updateResidusUI, 500);
            } else {
                if (residusAudio) {
                    residusAudio.pause();
                    residusAudio.currentTime = 0;
                }
                if (audioTimerInterval) clearInterval(audioTimerInterval);
            }
        }

        function toggleResidusAudio() {
            if (!residusAudio) return;
            if (residusAudio.paused) {
                residusAudio.play().catch(e => console.log("Playback blocked:", e));
            } else {
                residusAudio.pause();
            }
            updateResidusUI();
        }

        function updateResidusUI() {
            const dot = document.getElementById('residus-audio-dot');
            const timer = document.getElementById('residus-timer');
            if (!residusAudio) return;

            let isPlaying = !residusAudio.paused && residusAudio.currentTime > 0 && !residusAudio.ended;
            if (dot) {
                if (isPlaying) {
                    dot.style.background = 'rgb(0, 0, 255)';
                    dot.style.borderColor = 'rgb(0, 0, 255)';
                } else {
                    dot.style.background = '#fff';
                    dot.style.borderColor = '#000';
                }
            }
            if (timer) {
                let curM = Math.floor(residusAudio.currentTime / 60);
                let curS = Math.floor(residusAudio.currentTime % 60);
                let durM = isNaN(residusAudio.duration) ? 0 : Math.floor(residusAudio.duration / 60);
                let durS = isNaN(residusAudio.duration) ? 0 : Math.floor(residusAudio.duration % 60);
                timer.textContent = `${curM}:${curS < 10 ? '0':''}${curS} / ${durM}:${durS < 10 ? '0':''}${durS}`;
            }
        }

        /* Two-Page PDF Viewer Handler for 'The waiting line' */
        let pdfDoc = null,
            pageNum = 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 0.7;

        function initPdfViewer() {
            const url = 'images/waiting-line.pdf';
            pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
                pdfDoc = pdfDoc_;
                pageNum = 1;
                renderSpread(pageNum);
                
                const pdfContainer = document.getElementById('pdf-viewer-container');
                const customCursor = document.getElementById('custom-cursor-dot');

                if (pdfContainer && customCursor) {
                    pdfContainer.onmouseenter = function() {
                        customCursor.style.display = 'block';
                    };
                    pdfContainer.onmouseleave = function() {
                        customCursor.style.display = 'none';
                    };
                    pdfContainer.onmousemove = function(e) {
                        customCursor.style.left = e.clientX + 'px';
                        customCursor.style.top = e.clientY + 'px';
                    };

                    pdfContainer.onclick = function(e) {
                        if (pageRendering) return;
                        const rect = pdfContainer.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        if (x < rect.width / 2) {
                            if (pageNum > 2) {
                                pageNum -= 2;
                                queueRenderSpread(pageNum);
                            } else if (pageNum > 1) {
                                pageNum = 1;
                                queueRenderSpread(pageNum);
                            }
                        } else {
                            if (pageNum + 2 <= pdfDoc.numPages) {
                                pageNum += 2;
                                queueRenderSpread(pageNum);
                            }
                        }
                    };
                }
            }).catch(error => {
                console.log("Error loading PDF:", error);
            });
        }

        function renderSpread(num) {
            pageRendering = true;
            let canvasLeft = document.getElementById('pdf-canvas-left');
            let canvasRight = document.getElementById('pdf-canvas-right');
            let frameLeft = document.getElementById('frame-left');
            let frameRight = document.getElementById('frame-right');

            if (!canvasLeft || !canvasRight || !frameLeft || !frameRight) return;

            frameLeft.style.opacity = '0';
            frameRight.style.opacity = '0';

            setTimeout(() => {
                let ctxLeft = canvasLeft.getContext('2d');
                let ctxRight = canvasRight.getContext('2d');

                pdfDoc.getPage(num).then(function(page1) {
                    let viewport1 = page1.getViewport({scale: scale});
                    canvasLeft.height = viewport1.height;
                    canvasLeft.width = viewport1.width;
                    ctxLeft.clearRect(0, 0, canvasLeft.width, canvasLeft.height);

                    page1.render({ canvasContext: ctxLeft, viewport: viewport1 }).promise.then(() => {
                        frameLeft.style.opacity = '1';

                        if (num + 1 <= pdfDoc.numPages) {
                            pdfDoc.getPage(num + 1).then(function(page2) {
                                let viewport2 = page2.getViewport({scale: scale});
                                frameRight.style.display = 'block';
                                canvasRight.height = viewport2.height;
                                canvasRight.width = viewport2.width;
                                ctxRight.clearRect(0, 0, canvasRight.width, canvasRight.height);

                                page2.render({ canvasContext: ctxRight, viewport: viewport2 }).promise.then(() => {
                                    frameRight.style.opacity = '1';
                                    pageRendering = false;
                                    if (pageNumPending !== null) {
                                        renderSpread(pageNumPending);
                                        pageNumPending = null;
                                    }
                                });
                            });
                        } else {
                            frameRight.style.display = 'none';
                            pageRendering = false;
                            if (pageNumPending !== null) {
                                renderSpread(pageNumPending);
                                pageNumPending = null;
                            }
                        }
                    });
                });
            }, 150);
        }

        function queueRenderSpread(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderSpread(num);
            }
        }

        function showKitchenDescription(imageIndex) {
            const box = document.getElementById('image-description-box');
            const content = document.getElementById('image-description-content');
            if (box && content && kitchenDescriptions[imageIndex]) {
                content.innerHTML = kitchenDescriptions[imageIndex];
                box.classList.add('active');
            }
        }

        function closeImageDescription() {
            const box = document.getElementById('image-description-box');
            if (box) {
                box.classList.remove('active');
            }
        }

        function updateHash(mainTab, subKey = null) {
            let hash = '#' + mainTab.toLowerCase().replace(/\s+/g, '-');
            if (subKey) {
                if (mainTab === 'Works') {
                    const idx = workKeys.indexOf(subKey);
                    if (idx !== -1) hash += '-' + (idx + 1);
                    else hash += '-' + subKey;
                } else {
                    hash += '-' + subKey;
                }
            }
            window.location.hash = hash;
        }

        function setThankYouNote(key = null) {
            let thankYouBox = document.getElementById('thank-you-note');
            if (!thankYouBox) {
                thankYouBox = document.createElement('div');
                thankYouBox.id = 'thank-you-note';
                container.appendChild(thankYouBox);
            }
            if (key && thanksData[key]) {
                thankYouBox.innerHTML = thanksData[key];
            } else {
                thankYouBox.innerHTML = '';
            }
        }

        function initializeNavigation() {
            container.innerHTML = '';
            
            let navItems = [
                ...tabs.map(t => ({ type: 'tab', name: t, id: `dot-${t}` })),
                ...workKeys.map((key, idx) => ({ type: 'work', key: key, num: idx + 1, id: `work-${key}` }))
            ];

            let placedCoordinates = [];
            
            navItems.forEach((item) => {
                const el = document.createElement('div');
                let posX, posY, overlapping;
                let attempts = 0;

                do {
                    overlapping = false;
                    posX = Math.random() * (window.innerWidth * 0.15 - 40) + 10;
                    posY = Math.random() * (window.innerHeight - 180) + 40;

                    for (let p of placedCoordinates) {
                        let dx = p.x - posX;
                        let dy = p.y - posY;
                        let distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 50) {
                            overlapping = true;
                            break;
                        }
                    }
                    attempts++;
                } while (overlapping && attempts < 50);

                placedCoordinates.push({ x: posX, y: posY });

                if (item.type === 'tab') {
                    el.className = 'dot';
                    el.id = item.id;
                    el.style.top = posY + 'px';
                    el.style.right = posX + 'px';
                    el.onclick = () => activateTab(item.name);
                } else {
                    el.className = 'work-trigger trigger';
                    el.id = item.id;
                    el.style.top = posY + 'px';
                    el.style.right = posX + 'px';
                    el.textContent = item.num;
                    el.onclick = () => showWork(item.key);
                }
                container.appendChild(el);
            });

            const thankYouBox = document.createElement('div');
            thankYouBox.id = 'thank-you-note';
            container.appendChild(thankYouBox);
        }

        function activateTab(tabName, subTabToOpen = null) {
            document.querySelectorAll('.dot').forEach(d => {
                if(d.id !== 'entry-dot') d.classList.remove('active');
            });
            const dot = document.getElementById(`dot-${tabName}`);
            if (dot) dot.classList.add('active');

            document.querySelectorAll('.work-trigger').forEach(wt => {
                if (tabName === 'Works') wt.classList.add('visible');
                else wt.classList.remove('visible');
            });

            if (subTabToOpen !== 'residus') {
                handleResidusAudio(false);
            }

            setThankYouNote(null);
            renderTab(tabName, subTabToOpen);

            if (tabName === 'Contact') updateHash('Contact');
            else if (tabName === 'Works' && !subTabToOpen) updateHash('Works');
            else if (tabName === 'Collaborative projects' && !subTabToOpen) updateHash('Collaborative projects');
            else if (tabName === 'Text' && !subTabToOpen) updateHash('Text');
        }

        function renderTab(tabName, autoOpenSub = null) {
            display.innerHTML = '';
            
            if (tabName === 'Contact') {
                display.innerHTML = `
                    <div class="blue-text">
                        <div>Clémence Ledent</div><div>°2000, Brussels</div>
                        <div>ledent.clemence@gmail.com</div>
                    </div>
                    <div class="contact-bio">
                        <p>Clémence Ledent explores the invisible scripts and social codes that define our daily behaviour. Informed by her background in architecture, she examines space, function, and the impact they have on the body. Her practice is scenario-based: each project begins with an autopsy of the structures that determine how we move, wait, listen, or act. Echoing Nathalie Sarraute’s notion of tropisms, she seeks to capture the minute, imperceptible movements beneath the surface, blurring the lines between human agency and ingrained automatisms.</p>
                        <p>The concept of ‘presence in absence’ is central to her work. By underlining the subtle sounds embedded in our daily gestures, or by deconstructing those gestures into singular happenings, Ledent shifts the spectator into an almost voyeuristic position toward how we carry ourselves. What appears playful or absurd ultimately reveals the orchestrated fragility of how we live with and alongside one another.</p>
                    </div>`;
            } else if (tabName === 'Works') {
                display.innerHTML = `<div id="content-area"></div>`;
                if(autoOpenSub) {
                    showWork(autoOpenSub);
                } else {
                    document.getElementById('content-area').innerHTML = '';
                }
            } else if (tabName === 'Collaborative projects') {
                display.innerHTML = `
                    <div class="works-nav">
                        <span class="collab-trigger trigger" id="collab-troue" onclick="showCollab('troue')">Le bazar tr<span class="filled-o">o</span>ué</span>
                        <span class="collab-trigger trigger" id="collab-braida" onclick="showCollab('braida')">toç in braida</span>
                        <span class="collab-trigger trigger" id="collab-rotte" onclick="showCollab('rotte')">Alle rotte takken</span>
                    </div><div id="content-area"></div>`;
                if(autoOpenSub) showCollab(autoOpenSub);
            } else if (tabName === 'Text') {
                display.innerHTML = `
                    <div class="subnav-container">
                        <a href="denkbeeldige-ruimte.html" class="trigger">De denkbeeldige ruimte</a>
                        <a href="shopsign.html" class="trigger">De shopsign</a>
                        <a href="tafelgebeuren.html" class="trigger">Het rigiditeitsgehalte van een tafelgebeuren</a>
                        <a href="rigiditeitsgehalte.html" target="_blank" class="trigger">de rigiditeitsgehalte van een tafelgebeuren</a>
                    </div><div id="content-area"></div>`;
                if(autoOpenSub) showText(autoOpenSub);
            }
        }

        function showWork(key) {
            document.querySelectorAll('.dot').forEach(d => {
                if(d.id !== 'entry-dot') d.classList.remove('active');
            });
            const workDot = document.getElementById('dot-Works');
            if (workDot) workDot.classList.add('active');

            document.querySelectorAll('.work-trigger').forEach(wt => wt.classList.add('visible'));

            if (!document.getElementById('content-area')) {
                display.innerHTML = `<div id="content-area"></div>`;
            }

            document.querySelectorAll('.work-trigger').forEach(t => t.classList.remove('active'));
            const el = document.getElementById('work-' + key);
            if(el) el.classList.add('active');

            if (key === 'residus') {
                handleResidusAudio(true);
            } else {
                handleResidusAudio(false);
            }

            if (worksData[key]) {
                document.getElementById('content-area').innerHTML = worksData[key].info;
                if (key === 'residus') {
                    updateResidusUI();
                }
            }

            if (key === 'waitingline') {
                initPdfViewer();
            }

            setThankYouNote(key);
            updateHash('Works', key);
        }

        function showCollab(key) {
            setThankYouNote(null);
            document.querySelectorAll('.collab-trigger').forEach(t => t.classList.remove('active'));
            const el = document.getElementById('collab-' + key);
            if(el) el.classList.add('active');
            document.getElementById('content-area').innerHTML = collabData[key].info;
            updateHash('Collaborative projects', key);
        }

        entryDot.onclick = function() {
            if (!this.classList.contains('transformed')) {
                this.classList.add('transformed');
                initializeNavigation();
                parseHashAndNavigate();
            }
        };

        function parseHashAndNavigate() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            if (hash === 'contact') {
                activateTab('Contact');
            } else if (hash === 'works') {
                activateTab('Works');
            } else if (hash.startsWith('works-')) {
                const sub = hash.replace('works-', '');
                let workKey = sub;
                if (!isNaN(sub)) {
                    const idx = parseInt(sub) - 1;
                    if (workKeys[idx]) workKey = workKeys[idx];
                }
                activateTab('Works', workKey);
            } else if (hash === 'collaborative-projects' || hash === 'collaborative' || hash === 'collab') {
                activateTab('Collaborative projects');
            } else if (hash.startsWith('collaborative-projects-') || hash.startsWith('collab-')) {
                const sub = hash.replace('collaborative-projects-', '').replace('collab-', '');
                activateTab('Collaborative projects', sub);
            } else if (hash === 'text') {
                activateTab('Text');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                entryDot.classList.add('transformed');
                initializeNavigation();
                parseHashAndNavigate();
            }
        });
    </script>
