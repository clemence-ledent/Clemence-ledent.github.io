<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Het rigiditeitsgehalte van een tafelgebeuren — Clémence Ledent</title>
    <style>
        body {
            margin: 0;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            cursor: default;
        }

        #booklet-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .page-frame {
            border: 1px solid #000;
            border-radius: 2px;
            background: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }

        .page-frame img {
            display: block;
            max-height: 75vh;
            width: auto;
            object-fit: contain;
        }

        #custom-cursor-dot {
            display: none;
            position: fixed;
            width: 32px;
            height: 32px;
            background: #000;
            border: 1.8px solid #000;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
        }

        #back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: #000;
            text-decoration: underline;
            font-size: 15px;
            font-weight: 300;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <a href="index.html#text" id="back-link">← Back to portfolio</a>

    <div id="booklet-container" onclick="turnPage(event)">
        <div class="page-frame" id="frame-left">
            <img id="img-left" src="" alt="Page Left">
        </div>
        <div class="page-frame" id="frame-right">
            <img id="img-right" src="" alt="Page Right">
        </div>
    </div>

    <div id="custom-cursor-dot"></div>

    <script>
        // Total 16 pages (R1 to R16). 
        // Note: Change '.jpg' below if your images are .png or another extension.
        const totalPages = 16;
        const imageExtension = '.jpg'; 
        let currentIndex = 1; // R1 starts alone

        const container = document.getElementById('booklet-container');
        const frameLeft = document.getElementById('frame-left');
        const frameRight = document.getElementById('frame-right');
        const imgLeft = document.getElementById('img-left');
        const imgRight = document.getElementById('img-right');
        const customCursor = document.getElementById('custom-cursor-dot');

        function updateBooklet() {
            frameLeft.style.opacity = '0';
            frameRight.style.opacity = '0';

            setTimeout(() => {
                if (currentIndex === 1) {
                    // Page 1 alone
                    imgLeft.src = `rigiditeitsgehalte/R1${imageExtension}`;
                    frameLeft.style.display = 'flex';
                    frameRight.style.display = 'none';
                } else if (currentIndex === totalPages) {
                    // Last page (R16) alone
                    imgLeft.src = `rigiditeitsgehalte/R${totalPages}${imageExtension}`;
                    frameLeft.style.display = 'flex';
                    frameRight.style.display = 'none';
                } else {
                    // Spread of two pages side-by-side
                    imgLeft.src = `rigiditeitsgehalte/R${currentIndex}${imageExtension}`;
                    imgRight.src = `rigiditeitsgehalte/R${currentIndex + 1}${imageExtension}`;
                    frameLeft.style.display = 'flex';
                    frameRight.style.display = 'flex';
                }

                frameLeft.style.opacity = '1';
                frameRight.style.opacity = '1';
            }, 150);
        }

        function turnPage(e) {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;

            if (x < rect.width / 2) {
                // Clicked left -> Go backward
                if (currentIndex === totalPages) {
                    currentIndex = totalPages - 2; // from R16 back to R14-R15 spread
                } else if (currentIndex > 1) {
                    currentIndex -= 2;
                    if (currentIndex < 1) currentIndex = 1;
                }
            } else {
                // Clicked right -> Go forward
                if (currentIndex === 1) {
                    currentIndex = 2; // from R1 to R2-R3 spread
                } else if (currentIndex < totalPages - 1) {
                    currentIndex += 2;
                    if (currentIndex >= totalPages) {
                        currentIndex = totalPages;
                    }
                } else if (currentIndex === totalPages - 1 || currentIndex === totalPages - 2) {
                    currentIndex = totalPages; // reach final R16 alone
                }
            }
            updateBooklet();
        }

        // Custom dot cursor behavior
        container.onmouseenter = () => { customCursor.style.display = 'block'; };
        container.onmouseleave = () => { customCursor.style.display = 'none'; };
        container.onmousemove = (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
        };

        // Initialize first view
        updateBooklet();
    </script>
</body>
</html>
