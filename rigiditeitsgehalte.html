<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Het rigiditeitsgehalte van een tafelgebeuren</title>
    <style>
        body {
            margin: 0;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 100px 20px;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        #booklet-scroll-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0; /* No vertical gap between rows */
            max-width: 100%;
        }

        /* Single standalone page (R1 and R16) */
        .page-single {
            border: 1px solid #000;
            background: #fff;
            margin-bottom: 0;
        }

        .page-single img {
            display: block;
            height: 60vh;
            max-width: 120%;
            object-fit: contain;
        }

        /* Two-by-two row container */
        .page-row {
            display: flex;
            gap: 0; /* Zero gap between the two pages */
        }

        /* Individual page frame in a row */
        .page-frame {
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            border-left: 1px solid #000;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Give the right page its right border, and remove double borders in the middle */
        .page-frame:last-child {
            border-right: 1px solid #000;
        }

        .page-frame img {
            display: block;
            height: 60vh;
            max-width: 100%;
            object-fit: contain;
        }

        #back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: #000;
            text-decoration: underline;
            font-size: 15px;
            font-weight: 300;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <a href="index.html#text" id="back-link">← Back to portfolio</a>

    <div id="booklet-scroll-container">
        <!-- R1: First page alone -->
        <div class="page-single">
            <img src="rigiditeitsgehalte/R1.jpg" alt="Rigiditeitsgehalte R1">
        </div>

        <!-- Rows for R2 to R15 (Two by two, touching) -->
        <div class="page-row">
            <div class="page-frame"><img src="rigiditeitsgehalte/R2.jpg" alt="R2"></div>
            <div class="page-frame"><img src="rigiditeitsgehalte/R3.jpg" alt="R3"></div>
        </div>
        <div class="page-row">
            <div class="page-frame"><img src="rigiditeitsgehalte/R4.jpg" alt="R4"></div>
            <div class="page-frame"><img src="rigiditeitsgehalte/R5.jpg" alt="R5"></div>
        </div>
        <div class="page-row">
            <div class="page-frame"><img src="rigiditeitsgehalte/R6.jpg" alt="R6"></div>
            <div class="page-frame"><img src="rigiditeitsgehalte/R7.jpg" alt="R7"></div>
        </div>
        <div class="page-row">
            <div class="page-frame"><img src="rigiditeitsgehalte/R8.jpg" alt="R8"></div>
            <div class="page-frame"><img src="rigiditeitsgehalte/R9.jpg" alt="R9"></div>
        </div>
        <div class="page-row">
            <div class="page-frame"><img src="rigiditeitsgehalte/R10.jpg" alt="R10"></div>
            <div class="page-frame"><img src="rigiditeitsgehalte/R11.jpg" alt="R11"></div>
        </div>
        <div class="page-row">
            <div class="page-frame"><img src="rigiditeitsgehalte/R12.jpg" alt="R12"></div>
            <div class="page-frame"><img src="rigiditeitsgehalte/R13.jpg" alt="R13"></div>
        </div>
        <div class="page-row">
            <div class="page-frame"><img src="rigiditeitsgehalte/R14.jpg" alt="R14"></div>
            <div class="page-frame"><img src="rigiditeitsgehalte/R15.jpg" alt="R15"></div>
        </div>

        <!-- R16: Last page alone -->
        <div class="page-single">
            <img src="rigiditeitsgehalte/R16.jpg" alt="Rigiditeitsgehalte R16">
        </div>
    </div>

</body>
</html>
