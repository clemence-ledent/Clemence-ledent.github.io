<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clémence Ledent</title>
    <style>
        body { margin: 0; background: #fff; height: 100vh; overflow: hidden; position: relative; }
        
        .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #000;
            border: 1.8px solid #000;
            box-sizing: border-box;
            display: inline-block;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            position: absolute;
        }

        #entry-dot {
            top: 15%;
            right: 10%;
        }
    </style>
</head>
<body>
    <a href="home.html">
        <div id="entry-dot" class="dot"></div>
    </a>
</body>
</html>
