<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .tab-dot {
            position: absolute;
            border-radius: 50%;
            background-color: #000;
        }
        img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <img src="your-image-source.jpg" alt="Homepage Image">
    <script>
        const tabDots = [];
        const dotCount = 20; // Number of dots
        const containerSize = window.innerWidth; // Width of the viewport
        const avoidAreaRadius = 150; // Radius of the area to avoid in the center
        const centerX = containerSize / 2;
        const centerY = window.innerHeight / 2;

        function scatterDots() {
            for (let i = 0; i < dotCount; i++) {
                const dot = document.createElement('div');
                dot.className = 'tab-dot';
                const x = Math.random() * containerSize;
                const y = Math.random() * window.innerHeight;
                // Check if dot is in the avoided area
                if (Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2)) > avoidAreaRadius) {
                    dot.style.width = '10px';
                    dot.style.height = '10px';
                    dot.style.left = x + 'px';
                    dot.style.top = y + 'px';
                    document.body.appendChild(dot);
                    tabDots.push(dot);
                }
            }
        }

        scatterDots();
    </script>
</body>
</html>
