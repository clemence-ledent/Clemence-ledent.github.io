<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clémence Ledent</title>
    <style>
        body { 
            margin: 0; 
            background: #fff; 
            min-height: 100vh; 
            font-family: sans-serif; 
            overflow-y: auto; 
            display: flex;
            overflow-x: hidden;
        }

        /* 75% Content Column */
        #content-wrapper {
            flex: 0 0 75%; 
            display: flex;
            flex-direction: column;
            align-items: center; /* This centers the children horizontally */
            padding: 80px 0;
            z-index: 1;
        }

        /* Inner container to hold the images */
        #content-display {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 25% Navigation Column */
        #nav-zone {
            flex: 0 0 25%; 
            position: relative;
        }

        .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #000;
            border: 1.8px solid #000;
            box-sizing: border-box;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            position: fixed; 
            z-index: 100;
        }

        #entry-dot {
            top: 15%;
            right: 5%;
        }

        .dot.active {
            background: rgb(0, 0, 255) !important;
            border-color: rgb(0, 0, 255) !important;
        }

        .composition-img {
            max-height: 85vh; 
            max-width: 85%; /* Slightly smaller to ensure breathing room */
            height: auto;
            width: auto;
            margin-bottom: 120px; 
            display: block;
            object-fit: contain;
        }

        h2 {
            font-weight: normal;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="content-wrapper">
        <div id="content-display"></div>
    </div>

    <div id="nav-zone">
        <div id="entry-dot" class="dot"></div>
        <div id="tab-dots"></div>
    </div>

    <script>
        const tabs = ['Works', 'Contact', 'Text', 'Compositions'];
        // Updated Image list
        const compositionImages = [
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-1.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-2.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-3.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-4.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-5.png"
        ];

        const container = document.getElementById('tab-dots');
        const display = document.getElementById('content-display');

        function placeDots() {
            container.innerHTML = ''; 
            tabs.forEach(tabName => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                
                const minX = window.innerWidth * 0.75; 
                const maxX = window.innerWidth - 45; 
                const randomX = minX + Math.random() * (maxX - minX);
                const randomY = 40 + Math.random() * (window.innerHeight - 80);
                
                dot.style.left = randomX + 'px';
                dot.style.top = randomY + 'px';

                dot.onclick = () => {
                    document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                    dot.classList.add('active');
                    display.innerHTML = '';

                    if (tabName === 'Compositions') {
                        compositionImages.forEach(src => {
                            const img = document.createElement('img');
                            img.src = src;
                            img.className = 'composition-img';
                            img.alt = "collage";
                            display.appendChild(img);
                        });
                    } else {
                        display.innerHTML = `<h2>${tabName}</h2>`;
                    }
                };
                container.appendChild(dot);
            });
        }

        placeDots();
        window.onresize = placeDots;
    </script>
</body>
</html>
