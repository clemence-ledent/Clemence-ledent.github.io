<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clémence Ledent</title>
    <style>
        body { 
            margin: 0; 
            background: #fff; 
            min-height: 100vh; 
            font-family: sans-serif; 
            /* allow scrolling if content is long */
            overflow-y: auto; 
            position: relative;
        }

        .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #000;
            border: 1.8px solid #000;
            box-sizing: border-box;
            display: inline-block;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            position: fixed; /* Keep dots fixed so they stay while scrolling content */
            z-index: 100;
        }

        #entry-dot {
            top: 15%;
            right: 10%;
        }

        .dot.active {
            background: rgb(0, 0, 255);
            border-color: rgb(0, 0, 255);
        }

        /* Container for the scrollable images */
        #content-display {
            padding: 120px 20px 60px 20px; /* Space for dots at the top */
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .composition-img {
            max-width: 100%;
            height: auto;
            margin-bottom: 80px; /* Large margin between images */
            display: block;
        }
    </style>
</head>
<body>

    <div id="entry-dot" class="dot"></div>
    <div id="tab-dots"></div>

    <div id="content-display">
        </div>

    <script>
        const tabs = ['Works', 'Contact', 'Text', 'Compositions'];
        const compositionImages = [
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-1.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-2.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-3.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-4.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-5.jpg"
        ];

        const container = document.getElementById('tab-dots');
        const display = document.getElementById('content-display');

        tabs.forEach(tabName => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            
            // Random scatter
            const randomX = Math.random() * (window.innerWidth - 60);
            const randomY = Math.random() * (window.innerHeight - 60);
            dot.style.left = randomX + 'px';
            dot.style.top = randomY + 'px';

            dot.onclick = () => {
                document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                
                // Clear current content
                display.innerHTML = '';

                if (tabName === 'Compositions') {
                    compositionImages.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.className = 'composition-img';
                        img.alt = "collage";
                        display.appendChild(img);
                    });
                } else {
                    // Placeholder for other tabs
                    display.innerHTML = `<h2>${tabName}</h2>`;
                }
            };

            container.appendChild(dot);
        });
    </script>
</body>
</html>
