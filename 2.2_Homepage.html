<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clémence Ledent</title>
    <style>
        body { 
            margin: 0; 
            background: #fff; 
            min-height: 100vh; 
            font-family: sans-serif; 
            overflow-y: auto; 
            display: flex; /* Creates the invisible column structure */
        }

        /* The Left/Center Column for Content */
        #content-wrapper {
            flex: 0 0 65%; /* Takes up 65% of the screen width */
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers images within the left column */
            padding: 60px 0;
            z-index: 1;
        }

        /* The Right Column for Navigation (Invisible) */
        #nav-zone {
            flex: 0 0 35%; /* The "Safe Zone" for dots */
            position: relative;
        }

        .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #000;
            border: 1.8px solid #000;
            box-sizing: border-box;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            position: fixed; /* Keeps dots on screen while scrolling */
            z-index: 100;
        }

        #entry-dot {
            top: 15%;
            right: 5%; /* Adjusted slightly for the new column */
        }

        .dot.active {
            background: rgb(0, 0, 255);
            border-color: rgb(0, 0, 255);
        }

        .composition-img {
            max-height: 85vh; 
            max-width: 90%; /* Images fill most of their column but stay safe */
            height: auto;
            width: auto;
            margin-bottom: 100px;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="content-wrapper">
        <div id="content-display"></div>
    </div>

    <div id="nav-zone">
        <div id="entry-dot" class="dot"></div>
        <div id="tab-dots"></div>
    </div>

    <script>
        const tabs = ['Works', 'Contact', 'Text', 'Compositions'];
        const compositionImages = [
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-1.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-2.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-3.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-4.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/Compositions/collage-5.jpg"
        ];

        const container = document.getElementById('tab-dots');
        const display = document.getElementById('content-display');

        tabs.forEach(tabName => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            
            // MATH FOR THE RIGHT COLUMN ONLY:
            // Dots start at 65% of window width and end at 95%
            const minX = window.innerWidth * 0.65; 
            const maxX = window.innerWidth * 0.95;
            const randomX = minX + Math.random() * (maxX - minX);
            
            // Randomly scatter vertically
            const randomY = Math.random() * (window.innerHeight - 60);
            
            dot.style.left = randomX + 'px';
            dot.style.top = randomY + 'px';

            dot.onclick = () => {
                document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                display.innerHTML = '';

                if (tabName === 'Compositions') {
                    compositionImages.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.className = 'composition-img';
                        img.alt = "collage";
                        display.appendChild(img);
                    });
                } else {
                    display.innerHTML = `<h2 style="font-weight: normal; color: #333;">${tabName}</h2>`;
                }
            };

            container.appendChild(dot);
        });
    </script>
</body>
</html>
