<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clémence Ledent</title>
    <style>
        body { 
            margin: 0; 
            background: #fff; 
            min-height: 100vh; 
            font-family: sans-serif; 
            overflow: hidden;
            position: relative;
        }

        .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #000;
            border: 1.8px solid #000;
            box-sizing: border-box;
            display: inline-block;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            position: fixed;
            z-index: 100;
        }

        #entry-dot {
            top: 15%;
            right: 10%;
        }

        .dot.active {
            background: rgb(0, 0, 255);
            border-color: rgb(0, 0, 255);
        }

        /* Container for the images */
        #content-display {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .composition-img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <div id="entry-dot" class="dot"></div>
    <div id="tab-dots"></div>

    <div id="content-display">
        </div>

    <script>
        const tabs = ['Works', 'Contact', 'Text', 'Compositions'];
        const compositionImages = [
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-1.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-2.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-3.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-4.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/main/collage-5.jpg"
        ];

        function getRandomPosition() {
            const centerMinX = window.innerWidth * 0.3;
            const centerMaxX = window.innerWidth * 0.7;
            const centerMinY = window.innerHeight * 0.3;
            const centerMaxY = window.innerHeight * 0.7;

            let randomX, randomY;
            let inCenter = true;

            // Keep generating until we get a position outside the center area
            while (inCenter) {
                randomX = Math.random() * (window.innerWidth - 60);
                randomY = Math.random() * (window.innerHeight - 60);
                
                inCenter = (randomX > centerMinX && randomX < centerMaxX) && 
                          (randomY > centerMinY && randomY < centerMaxY);
            }

            return { x: randomX, y: randomY };
        }

        const container = document.getElementById('tab-dots');
        const display = document.getElementById('content-display');

        tabs.forEach(tabName => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            
            // Random scatter avoiding center
            const position = getRandomPosition();
            dot.style.left = position.x + 'px';
            dot.style.top = position.y + 'px';

            dot.onclick = () => {
                document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                
                // Clear current content
                display.innerHTML = '';

                if (tabName === 'Compositions') {
                    compositionImages.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.className = 'composition-img';
                        img.alt = "collage";
                        display.appendChild(img);
                    });
                } else {
                    // Placeholder for other tabs
                    display.innerHTML = `<h2>${tabName}</h2>`;
                }
            };

            container.appendChild(dot);
        });
    </script>
</body>
</html>
