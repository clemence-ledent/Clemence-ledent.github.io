<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clémence Ledent</title>
    <style>
        /* All CSS must stay inside these style tags */
        body { 
            margin: 0; 
            background: #fff; 
            min-height: 100vh; 
            font-family: sans-serif; 
            overflow-y: auto; 
            display: flex;
        }

        /* The Left/Center Column - now 75% */
        #content-wrapper {
            flex: 0 0 75%; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            padding: 80px 0;
            z-index: 1;
        }

        /* The Right Column Area - now 25% */
        #nav-zone {
            flex: 0 0 25%; 
            position: relative;
        }

        .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #000;
            border: 1.8px solid #000;
            box-sizing: border-box;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            position: fixed; 
            z-index: 100;
        }

        /* Keeps the original entry dot in the upper right */
        #entry-dot {
            top: 15%;
            right: 5%;
        }

        .dot.active {
            background: rgb(0, 0, 255) !important;
            border-color: rgb(0, 0, 255) !important;
        }

        .composition-img {
            max-height: 85vh; 
            max-width: 90%; 
            height: auto;
            width: auto;
            margin-bottom: 100px;
            display: block;
            object-fit: contain;
        }

        h2 {
            font-weight: normal;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="content-wrapper">
        <div id="content-display"></div>
    </div>

    <div id="nav-zone">
        <div id="entry-dot" class="dot"></div>
        <div id="tab-dots"></div>
    </div>

    <script>
        const tabs = ['Works', 'Contact', 'Text', 'Compositions'];
        const compositionImages = [
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/compositions/collage-1.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/compositions/collage-2.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/compositions/collage-3.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/compositions/collage-4.jpg",
            "https://raw.githubusercontent.com/clemence-ledent/cl-mence-items/compositions/collage-5.jpg"
        ];

        const container = document.getElementById('tab-dots');
        const display = document.getElementById('content-display');

        tabs.forEach(tabName => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            
            // MATH FOR THE RIGHT 25% COLUMN:
            // Dots will start at 75% of window width and go up to 95%
            const minX = window.innerWidth * 0.75; 
            const maxX = window.innerWidth * 0.95;
            const randomX = minX + Math.random() * (maxX - minX);
            
            const randomY = Math.random() * (window.innerHeight - 60);
            
            dot.style.left = randomX + 'px';
            dot.style.top = randomY + 'px';

            dot.onclick = () => {
                // Remove blue from all dots
                document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                // Add blue to clicked dot
                dot.classList.add('active');
                
                display.innerHTML = '';

                if (tabName === 'Compositions') {
                    compositionImages.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.className = 'composition-img';
                        img.alt = "collage";
                        display.appendChild(img);
                    });
                } else {
                    display.innerHTML = `<h2>${tabName}</h2>`;
                }
            };

            container.appendChild(dot);
        });
    </script>
</body>
</html>
