<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clémence Ledent</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      width: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 40px); /* spacing allows for gap */
      grid-template-rows: repeat(7, 40px);
      gap: 8px;
    }
    .dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #000;
      border: 1.8px solid #000;
      box-sizing: border-box;
      display: inline-block;
      cursor: default;
      transition: background 0.3s, border-color 0.3s;
    }
    .dot.outline-blue {
      background: #fff;
      border: 1.8px solid rgb(0,0,255);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="grid" id="dotGrid"></div>
  <script>
    const gridRows = 7;
    const gridCols = 7;
    const specialRow = 4; // zero-indexed (row 5)
    const specialCol = 5; // zero-indexed (col 6)
    const grid = document.getElementById('dotGrid');
    let dots = [];
    for(let r=0; r<gridRows; r++) {
      for(let c=0; c<gridCols; c++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.dataset.row = r;
        dot.dataset.col = c;
        // Special outlined blue dot
        if(r === specialRow && c === specialCol) {
          dot.classList.add('outline-blue');
          dot.title = "Enter Site";
          dot.addEventListener('click', function() {
            window.location.href = `main.html?dot=${r}_${c}`;
          });
        }
        grid.appendChild(dot);
        dots.push(dot);
      }
    }
  </script>
</body>
</html>
